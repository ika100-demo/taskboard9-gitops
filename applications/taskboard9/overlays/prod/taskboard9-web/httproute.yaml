apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard9-web
  labels:
    app: taskboard9-web
    app.kubernetes.io/name: taskboard9-web
    app.kubernetes.io/part-of: taskboard9
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard9-web.taskboard9-prod.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard9-web
      port: 80
