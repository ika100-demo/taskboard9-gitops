apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: taskboard9-dev
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - name: taskboard9-api
      - name: taskboard9-web
  template:
    metadata:
      name: '{{name}}-dev'
    spec:
      project: default
      source:
        repoURL: https://github.com/ika100-demo/taskboard9-gitops
        targetRevision: main
        path: applications/taskboard9/overlays/dev/{{name}}
      destination:
        server: https://kubernetes.default.svc
        namespace: taskboard9-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
---
