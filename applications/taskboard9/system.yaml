# The taskboard9 system (read by scripts/render.py). One file describes it: owner, environments and components.
# Reference: docs/DOMAIN-MODEL.md. Edit with `/system:*` and `/component:*`, then `devbox run render` regenerates the
# ApplicationSets and every Kubernetes manifest under overlays/. Versions are never written here: they are pinned in overlays/.
system: taskboard9
owner: ika100-demo
# secretStore: where `remote` secrets of a component are read from (External Secrets Operator). `cluster-up` creates
# `platform-secrets`; real clusters point this at their Vault / AWS / GCP store.
secretStore:
  name: platform-secrets
  kind: ClusterSecretStore
# gateway: the Gateway API gateway that exposed components attach to (`cluster-up` installs Traefik's).
gateway:
  name: traefik-gateway
  namespace: kube-system
# environments: host is the hostname template ({component}, {system}, {env}); no host = not exposed there.
# policy: Kyverno guard rails per environment: off | audit | enforce (starter: off everywhere).
# promote: after-dev-smoke = a green dev smoke promotes staging by itself; manual (default) = only /instance:promote.
environments:
  dev:
    host: "{component}.{system}-dev.localhost"
    policy: "off"
  staging:
    promote: after-dev-smoke
    policy: "off"
    host: '{component}.{system}-staging.localhost'
    # host: "{component}.staging.example.com"
  prod:
    policy: "off"
    # host: "{component}.example.com"
# components: add with `/component:new`; each runs in the environments listed under its `instances`.
components:
  taskboard9-api:
    type: service
    lang: python
    repo: ika100-demo/taskboard9-api
    image: ghcr.io/ika100-demo/taskboard9-api
    port: 8080
    probes:
      liveness: /health
      readiness: /ready
    user: 10001
    metrics: /metrics
    volumes:
      tmp: /tmp
    env:
      LOG_LEVEL: INFO
    secretRefs: []
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    instances:
      dev: {}
    expose:
      host: taskboard9-api
    uses:
      - postgres
  taskboard9-web:
    type: website
    lang: typescript
    repo: ika100-demo/taskboard9-web
    image: ghcr.io/ika100-demo/taskboard9-web
    port: 3000
    probes:
      liveness: /api/health
      readiness: /api/ready
    user: 1000
    metrics: /api/metrics
    volumes:
      tmp: /tmp
      next-cache: /app/.next/cache
    env:
      NODE_ENV: production
      API_URL: http://taskboard9-api
    secretRefs: []
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    instances:
      dev: {}
    expose:
      host: taskboard9-web
resources:
  postgres:
    type: database
    version: 17
    replicas: 1
    storage: 1Gi
    instances:
      prod:
        replicas: 3
        storage: 20Gi
